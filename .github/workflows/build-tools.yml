name: Build tools image

on:
  push:
    branches: [main]
    paths:
      - build-tools/**
      - .github/workflows/build-tools.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build-tools/Dockerfile
          build-args: |
            DEBIAN_VERSION=bookworm
          push: true
          tags: |
            ghcr.io/lyngbak-cloud/anabranch-build-tools:bookworm
            ghcr.io/lyngbak-cloud/anabranch-build-tools:bookworm-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/lyngbak-cloud/anabranch-build-tools:cache
          cache-to: type=registry,ref=ghcr.io/lyngbak-cloud/anabranch-build-tools:cache,mode=max
