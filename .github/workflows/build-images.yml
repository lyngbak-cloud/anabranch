name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/lyngbak-cloud

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  storage:
    needs: meta
    runs-on: ${{ vars.IMAGE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            GIT_VERSION=${{ github.sha }}
            BUILD_TAG=${{ needs.meta.outputs.tag }}
            DEBIAN_VERSION=bookworm
            REPOSITORY=${{ env.REGISTRY }}
            IMAGE=anabranch-build-tools
            TAG=bookworm
          push: true
          tags: |
            ${{ env.REGISTRY }}/anabranch:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.release == 'true' && format('{0}/anabranch:latest', env.REGISTRY) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/anabranch-cache:storage
          cache-to: type=registry,ref=${{ env.REGISTRY }}/anabranch-cache:storage,mode=max

  compute:
    needs: meta
    runs-on: ${{ vars.IMAGE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: v16
            debian: bullseye
          - pg: v17
            debian: bookworm
          - pg: v18
            debian: bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: compute/compute-node.Dockerfile
          build-args: |
            PG_VERSION=${{ matrix.pg }}
            BUILD_TAG=${{ needs.meta.outputs.tag }}
            DEBIAN_VERSION=${{ matrix.debian }}
            EXTENSIONS=${{ vars.COMPUTE_EXTENSIONS || 'all' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/anabranch-compute-${{ matrix.pg }}:${{ needs.meta.outputs.tag }}${{ vars.COMPUTE_EXTENSIONS && vars.COMPUTE_EXTENSIONS != 'all' && format('-{0}', vars.COMPUTE_EXTENSIONS) || '' }}
            ${{ needs.meta.outputs.release == 'true' && (vars.COMPUTE_EXTENSIONS == '' || vars.COMPUTE_EXTENSIONS == 'all') && format('{0}/anabranch-compute-{1}:latest', env.REGISTRY, matrix.pg) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/anabranch-cache:compute-${{ matrix.pg }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/anabranch-cache:compute-${{ matrix.pg }},mode=max
